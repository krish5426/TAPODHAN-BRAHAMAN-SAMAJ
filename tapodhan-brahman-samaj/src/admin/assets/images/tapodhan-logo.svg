<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer decorative circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FF8C00" stroke-width="8"/>
  
  <!-- Decorative mandala-like pattern around circle -->
  <defs>
    <pattern id="petals" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20,0 Q25,5 20,10 Q15,5 20,0" fill="#FF8C00" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="90" fill="#FF9933"/>
  
  <!-- Decorative pattern (12 elements around circle) -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="100" cy="20" r="3"/>
    <circle cx="158" cy="30" r="3"/>
    <circle cx="180" cy="78" r="3"/>
    <circle cx="170" cy="130" r="3"/>
    <circle cx="120" cy="180" r="3"/>
    <circle cx="80" cy="180" r="3"/>
    <circle cx="30" cy="170" r="3"/>
    <circle cx="20" cy="120" r="3"/>
    <circle cx="20" cy="80" r="3"/>
    <circle cx="30" cy="30" r="3"/>
  </g>
  
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="75" fill="white"/>
  
  <!-- Book/Pages on left side -->
  <g transform="translate(65, 70)">
    <!-- Left page -->
    <path d="M0,0 L20,0 L20,40 L0,40 Z" fill="#E8E8E8" stroke="#333" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M20,0 L40,0 L40,40 L20,40 Z" fill="white" stroke="#333" stroke-width="1.5"/>
    <!-- Page lines -->
    <line x1="3" y1="8" x2="17" y2="8" stroke="#999" stroke-width="0.8"/>
    <line x1="3" y1="14" x2="17" y2="14" stroke="#999" stroke-width="0.8"/>
    <line x1="3" y1="20" x2="17" y2="20" stroke="#999" stroke-width="0.8"/>
    <line x1="23" y1="8" x2="37" y2="8" stroke="#999" stroke-width="0.8"/>
    <line x1="23" y1="14" x2="37" y2="14" stroke="#999" stroke-width="0.8"/>
    <line x1="23" y1="20" x2="37" y2="20" stroke="#999" stroke-width="0.8"/>
  </g>
  
  <!-- Trident (Trishul) on top right -->
  <g transform="translate(95, 50)">
    <!-- Handle -->
    <line x1="0" y1="25" x2="0" y2="0" stroke="#8B0000" stroke-width="2.5"/>
    <!-- Top prongs -->
    <line x1="0" y1="0" x2="-8" y2="-12" stroke="#8B0000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#8B0000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="-12" stroke="#8B0000" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Central black circle (head) -->
  <circle cx="100" cy="125" r="20" fill="#333"/>
  
  <!-- Horizontal lines on black circle (eyes/face) -->
  <line x1="90" y1="120" x2="110" y2="120" stroke="white" stroke-width="1.5"/>
  <line x1="93" y1="128" x2="107" y2="128" stroke="white" stroke-width="1.5"/>
</svg>
